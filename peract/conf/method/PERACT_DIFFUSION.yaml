# @package _group_

name: 'PERACT_DIFFUSION'

horizon: 64
observation_dim: 7
hidden_dim: 256
dim_mults: [1, 2, 4]
scene_bounds: [[-0.5, -0.6, 0.75], [0.5, 0.55, 1.48]]
condition_dropout: 0.25
joint_limits: [[-2.89, -1.76, -2.89, -3.07, -2.89, -0.017, -2.89], [2.89, 1.76, 2.89, -0.069, 2.89, 3.75, 2.89]]

conditions: [start, end, proprios, rank, pcds] # pcds
hard_conditions: [proprios, pcds, start, end, rank]
rank_bins: 10
backbone: unet
num_encoder_layers: 4
num_decoder_layers: 4
n_head: 8
causal_attn: true

depth_proc: pointnet
rgb_encoder: resnet50

n_diffusion_steps: 100
delta_actions: false
noise_init_method: normal
loss_fn: state_l2
loss_type: l2
coverage_weight: 1.0

reverse_train: true
detach_reverse: false
trans_loss_scale: 100.0
rot_loss_scale: 1.0
num_episodes: 100
pred_deltas: false
pred_joints: false
joint_weight: 1.0
clip_denoised: true
inv_ik: false 
robot_offset: [0.30895137786865234, 0.0, -0.8200176358222961]
rot_loss_scale: 1.0
diffusion_var: multi
action_mode: diff
joint_pred_pose_loss: true
joint_loss_scale: 1.0
robot_rot: [[0.0, -0.15618760883808136, 0.9877274036407471], [0.0, -0.9877274036407471, -0.15618760883808136], [1.0, 0.0, 0.0]]

diff_optim: true
diff_optim_steps: 200
diff_lr: 10